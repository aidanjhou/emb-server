server:
  port: 8080

spring:
  application:
    name: emb-server

  # Spring AI OpenAI 兼容协议配置 (可自由对接 DeepSeek / 通义千问 / Kimi / Ollama / OpenAI)
  ai:
    openai:
      base-url: ${OPENAI_BASE_URL:https://api.deepseek.com}
      api-key: ${OPENAI_API_KEY:demo-key}
      chat:
        options:
          model: ${OPENAI_MODEL:deepseek-chat}
          temperature: 0.7
